name: Build Lichess Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LichessLite-AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded project ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f LichessLite-AndroidStudio.zip ]; then
            unzip -q LichessLite-AndroidStudio.zip
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/LichessLite" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download official Stockfish Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, pathlib, shutil, tarfile, urllib.request

          headers = {'User-Agent': 'LichessLite-CI', 'Accept': 'application/vnd.github+json'}
          endpoint = 'https://api.github.com/repos/official-stockfish/Stockfish/releases/latest'
          with urllib.request.urlopen(urllib.request.Request(endpoint, headers=headers), timeout=30) as response:
              release = json.load(response)

          filename = 'stockfish-android-arm64-universal.tar.gz'
          asset = next((a for a in release.get('assets', []) if a['name'] == filename), None)
          if asset is None:
              raise SystemExit('Missing official Stockfish Android ARM64 asset: ' + filename)
          print('Downloading', release['tag_name'], filename)
          url = asset['browser_download_url']
          archive = pathlib.Path('stockfish-android.tar.gz')
          request = urllib.request.Request(url, headers={'User-Agent': 'LichessLite-CI'})
          with urllib.request.urlopen(request, timeout=180) as response, archive.open('wb') as output:
              shutil.copyfileobj(response, output)

          with tarfile.open(archive, 'r:gz') as tar:
              matches = []
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  name = pathlib.PurePosixPath(member.name).name.lower()
                  if not name.startswith('stockfish') or name.endswith(('.txt', '.md', '.nnue')):
                      continue
                  stream = tar.extractfile(member)
                  if stream is None:
                      continue
                  magic = stream.read(4)
                  if magic == b'\x7fELF':
                      matches.append(member)
              if not matches:
                  raise SystemExit('No Stockfish ELF executable found. Archive files: ' + str(tar.getnames()))
              matches.sort(key=lambda x: ('android' not in x.name.lower(), len(x.name)))
              selected = matches[0]
              target = pathlib.Path(os.environ['PROJECT_DIR']) / 'app/src/main/jniLibs/arm64-v8a/libstockfish.so'
              target.parent.mkdir(parents=True, exist_ok=True)
              with tar.extractfile(selected) as src, target.open('wb') as dst:
                  shutil.copyfileobj(src, dst)
              print('Packaged:', selected.name, '->', target, '(' + str(target.stat().st_size) + ' bytes)')
          PYCODE
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LichessLite-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
