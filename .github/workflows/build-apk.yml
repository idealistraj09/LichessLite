name: Build Lichess Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LichessLite*.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          # Prefer the exact repository upload name; also accept v0.3 named ZIPs.
          files = [root / 'LichessLite-AndroidStudio.zip']
          files += sorted(root.glob('LichessLite-AndroidStudio*.zip'), key=lambda p: p.stat().st_mtime, reverse=True)
          files += sorted(root.glob('LichessLite*.zip'), key=lambda p: p.stat().st_mtime, reverse=True)
          archives = list(dict.fromkeys(p for p in files if p.is_file()))
          if archives:
              archive = archives[0]
              print('Extracting:', archive.name)
              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      relative = pathlib.PurePosixPath(member.filename)
                      if member.filename.startswith('/') or '..' in relative.parts:
                          raise RuntimeError('Unsafe ZIP entry: ' + member.filename)
                  z.extractall(root)
          candidates = [p.parent for p in root.rglob('settings.gradle.kts')]
          candidates += [p.parent for p in root.rglob('settings.gradle')]
          candidates = [p for p in candidates if (p / 'app' / 'build.gradle.kts').exists() or (p / 'app' / 'build.gradle').exists()]
          if not candidates:
              raise SystemExit('No Gradle Android project found. Upload the complete LichessLite project ZIP, including settings.gradle.kts.')
          candidates.sort(key=lambda p: (p != root / 'LichessLite', len(p.parts)))
          project = candidates[0]
          print('Gradle project:', project)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROJECT_DIR=' + str(project) + '\n')
          PYCODE
          echo 'Project root contents:'
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name 'settings.gradle*' -print
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download official Stockfish 19 Android ARM64 (no GitHub API)
        shell: bash
        run: |
          set -euo pipefail
          STOCKFISH_VERSION="sf_19"
          STOCKFISH_ARCHIVE="stockfish-android-arm64-universal.tar.gz"
          STOCKFISH_URL="https://github.com/official-stockfish/Stockfish/releases/download/${STOCKFISH_VERSION}/${STOCKFISH_ARCHIVE}"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 300 \
            --output "$RUNNER_TEMP/$STOCKFISH_ARCHIVE" "$STOCKFISH_URL"
          export STOCKFISH_ARCHIVE_PATH="$RUNNER_TEMP/$STOCKFISH_ARCHIVE"
          python3 - <<'PYCODE'
          import os, pathlib, shutil, struct, tarfile

          archive = pathlib.Path(os.environ['STOCKFISH_ARCHIVE_PATH'])
          if not tarfile.is_tarfile(archive):
              raise SystemExit('Download is not a valid tar archive')

          target = pathlib.Path(os.environ['PROJECT_DIR']) / 'app/src/main/jniLibs/arm64-v8a/libstockfish.so'
          target.parent.mkdir(parents=True, exist_ok=True)

          with tarfile.open(archive, 'r:gz') as tar:
              candidates = []
              for member in tar.getmembers():
                  if not member.isfile():
                      continue
                  if not pathlib.PurePosixPath(member.name).name.lower().startswith('stockfish'):
                      continue
                  stream = tar.extractfile(member)
                  if stream is None:
                      continue
                  header = stream.read(20)
                  # ELF little-endian machine AArch64 = 183 (0x00b7)
                  if len(header) >= 20 and header[:4] == b'\x7fELF' and header[5] == 1 and struct.unpack('<H', header[18:20])[0] == 183:
                      candidates.append(member)
              if not candidates:
                  raise SystemExit('No Android ARM64 Stockfish ELF found in release archive')
              selected = sorted(candidates, key=lambda m: len(m.name))[0]
              with tar.extractfile(selected) as source, target.open('wb') as dest:
                  shutil.copyfileobj(source, dest)
              target.chmod(0o755)
              print('Packaged', selected.name, 'as', target, 'size', target.stat().st_size)
          PYCODE
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LichessLite-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
