name: Build Lichess Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'LichessLite-AndroidStudio.zip'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded project ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f LichessLite-AndroidStudio.zip ]; then
            unzip -q LichessLite-AndroidStudio.zip
            echo "PROJECT_DIR=$GITHUB_WORKSPACE/LichessLite" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download official Stockfish Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, shutil, urllib.request, zipfile
          headers = {'User-Agent':'LichessLite-CI', 'Accept':'application/vnd.github+json'}
          request = urllib.request.Request('https://api.github.com/repos/official-stockfish/Stockfish/releases/latest', headers=headers)
          with urllib.request.urlopen(request, timeout=30) as r:
              release = json.load(r)
          assets = release.get('assets', [])
          matches = [x for x in assets if re.search(r'android[-_](?:armv8|arm64)(?:\.zip|[-_].*\.zip)$', x['name'], re.I) and 'dotprod' not in x['name'].lower()]
          if not matches:
              raise SystemExit('No compatible generic Android ARM64 ZIP in official Stockfish release: '+str([x['name'] for x in assets]))
          asset = matches[0]
          print('Using official release', release.get('tag_name'), 'asset', asset['name'])
          asset_req = urllib.request.Request(asset['browser_download_url'], headers={'User-Agent':'LichessLite-CI'})
          pathlib.Path('stockfish.zip').write_bytes(urllib.request.urlopen(asset_req, timeout=120).read())
          with zipfile.ZipFile('stockfish.zip') as z:
              candidates = [x for x in z.infolist() if not x.is_dir() and pathlib.PurePosixPath(x.filename).name.lower().startswith('stockfish-android-armv8') and not x.filename.lower().endswith(('.txt','.md','.nnue'))]
              if not candidates:
                  raise SystemExit('Stockfish binary missing in archive: '+str(z.namelist()))
              target = pathlib.Path(os.environ['PROJECT_DIR'])/'app/src/main/jniLibs/arm64-v8a/libstockfish.so'
              target.parent.mkdir(parents=True, exist_ok=True)
              with z.open(candidates[0]) as src, target.open('wb') as dst:
                  shutil.copyfileobj(src,dst)
              assert target.read_bytes()[:4] == b'\x7fELF', 'Stockfish binary is not ELF'
              print('Packaged ARM64 Stockfish:', target.stat().st_size, 'bytes')
          PY
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LichessLite-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
